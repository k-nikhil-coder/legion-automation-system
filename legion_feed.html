<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legion Feed - India Tech Community Dashboard</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--text:#14181f;--mute:#5b6572;--line:#e3e7ec;--accent:#16a34a;--chip:#eef1f4;
--job:#2563eb;--hack:#9333ea;--event:#ea580c;--course:#0d9488;--news:#64748b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--text:#e6edf3;--mute:#8b96a3;--line:#262d36;--chip:#1f262f}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--mute:#8b96a3;--line:#262d36;--chip:#1f262f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:16px 14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:21px;margin:0;letter-spacing:-.01em;font-weight:700}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:p 1.8s infinite}
@keyframes p{50%{opacity:.3}}
@keyframes pulse-live{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}
.pulse-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulse-live 1.4s infinite ease-in-out;margin-right:3px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;transition:background .15s}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.btn-wa{background:#0596691a;color:#059669;border-color:#05966940}
.btn.btn-wa:hover{background:#05966928}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-refresh{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.spin{display:inline-block;animation:rot 1s linear infinite}
@keyframes rot{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* Sticky Metro Hub Switcher Bar */
.city-bar{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:4px 0 8px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.city-bar::-webkit-scrollbar{display:none}
.city-pill{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--mute);transition:all .15s}
.city-pill:hover{border-color:var(--text);color:var(--text)}
.city-pill[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.hub-tag{background:#f59e0b26;color:#d97706;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700;margin-left:4px}

.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px;font-size:14px}
.search:focus{outline:2px solid var(--accent);border-color:transparent}

/* Segmented Category Filter Tray */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--mute)}
.tab[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.count{font-size:12.5px;color:var(--mute);margin:4px 0 8px;display:flex;justify-content:space-between;align-items:center}

/* Compact High-Density Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;transition:border-color .15s}
.card:hover{border-color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.top-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:999px;color:#fff}
.t-job{background:var(--job)}.t-hackathon{background:var(--hack)}.t-event{background:var(--event)}.t-course{background:var(--course)}.t-news{background:var(--news)}
.badge-status{font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--chip);color:var(--mute)}
.badge-hyd{background:#059669;color:#fff;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px}
.badge-online{background:#0284c7;color:#fff;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px}
.badge-live{background:#ef444420;color:#ef4444;border:1px solid #ef444450;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;display:inline-flex;align-items:center}
.badge-today{background:#f59e0b20;color:#d97706;border:1px solid #f59e0b50;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
.src{font-size:11.5px;color:var(--mute)}
.card h2{font-size:15.5px;margin:2px 0 4px;line-height:1.35;font-weight:600}

/* Strict summary line-clamp: maximum 3 lines with overflow protection */
.card p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;margin:0 0 8px;color:var(--mute);font-size:13.5px;line-height:1.45}

.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.meta span{background:var(--chip);border-radius:5px;padding:2px 7px;font-size:12px;color:var(--mute)}
.meta .soon{background:#fef3c7;color:#92400e;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
a.btn{text-decoration:none;display:inline-block}
.empty{text-align:center;color:var(--mute);padding:40px 0;font-size:14px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);width:min(480px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.25);font-weight:500}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>🇮🇳 Legion Feed</h1><span class="live"><span class="dot"></span><span id="upd"></span></span></div>
  <div style="display:flex;gap:6px">
    <button class="btn btn-refresh" id="refresh-btn" title="Refresh feed from 34 sources">🔄 Update Feed</button>
    <button class="btn" id="theme" title="Toggle theme">◐</button>
    <button class="btn pri" id="add">+ Add post</button>
  </div>
</header>

<!-- Sticky Metro Hub Switcher Bar -->
<div class="city-bar" id="city-bar">
  <button class="city-pill" data-city="all" aria-pressed="true">🇮🇳 All India</button>
  <button class="city-pill" data-city="hyderabad" aria-pressed="false">📍 Hyderabad<span class="hub-tag">📌 HUB</span></button>
  <button class="city-pill" data-city="bengaluru" aria-pressed="false">📍 Bengaluru</button>
  <button class="city-pill" data-city="mumbai" aria-pressed="false">📍 Mumbai</button>
  <button class="city-pill" data-city="delhi" aria-pressed="false">📍 Delhi NCR</button>
</div>

<input class="search" id="q" type="search" placeholder="Search opportunities, skills, venues…">

<!-- Category Filter Tray -->
<div class="tabs" id="tabs"></div>
<div class="count" id="count"></div>
<div id="feed"></div>
</div>

<dialog id="dlg">
  <h2 style="margin:0 0 4px;font-size:18px">Add a post</h2>
  <label>Type</label>
  <select id="f-type"><option value="job">Job / internship</option><option value="hackathon">Hackathon</option><option value="event">Event</option><option value="course">Course</option><option value="news">Tech news</option></select>
  <label>Title</label><input id="f-title">
  <label>Summary (keep under 180 chars)</label><textarea id="f-sum" rows="2" maxlength="220"></textarea>
  <label>Date or deadline</label><input id="f-date" type="date">
  <label>Where</label><input id="f-where" placeholder="Hyderabad / Online">
  <label>Source name</label><input id="f-src" placeholder="Community / Meetup">
  <label>Link</label><input id="f-link" type="url" placeholder="https://">
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
    <button class="btn" id="cancel">Cancel</button>
    <button class="btn pri" id="save">Save</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
var TYPES={all:"🚀 All",hackathon:"⚡ Hackathons",job:"💼 Jobs",event:"🗓️ Meetups",course:"🎓 Courses",news:"💡 Tech News",saved:"★ Saved"};
var TYPE_LABELS={job:"Job",hackathon:"Hackathon",event:"Event",course:"Course",news:"News"};
var TODAY = "2026-11-08";

// Clean, high-density initial seed items (fallback if posts.json is unavailable)
var SEED = [
  {
    "id": "s_hyd_hack",
    "type": "hackathon",
    "title": "Agentversity AI Hackathon: Build the Agentic Future",
    "sum": "Hyderabad flagship multi-agent AI hackathon. Hands-on mentorship, ₹5 Lakhs in compute credits and prizes.",
    "date": "2026-11-20",
    "where": "Hyderabad (T-Hub Phase 2)",
    "badge": "HYDERABAD - OFFLINE",
    "src": "Unstop",
    "link": "https://unstop.com/hackathons/agentversity-2026",
    "posted": "2026-11-08",
    "status": "pending"
  },
  {
    "id": "s_hyd_react",
    "type": "event",
    "title": "React Hyderabad Community Meetup – React 19 Patterns",
    "sum": "Deep dive into Server Actions, React Compiler, and edge rendering with Hyderabad frontend engineers.",
    "date": "2026-11-15",
    "where": "Hyderabad (DevX Gachibowli)",
    "badge": "HYDERABAD - OFFLINE",
    "src": "Meetup",
    "link": "https://www.meetup.com/react-hyderabad/",
    "posted": "2026-11-08",
    "status": "pending"
  },
  {
    "id": "s_job_anthropic",
    "type": "job",
    "title": "Senior Machine Learning Engineer at Anthropic",
    "sum": "Lead model alignment, evaluation pipelines, and low-latency inference. Remote across India or Bangalore hub.",
    "date": "2026-11-12",
    "where": "Remote / All India",
    "badge": "ONLINE",
    "src": "RemoteOK",
    "link": "https://remoteok.com/remote-jobs/senior-ml-engineer",
    "posted": "2026-11-08",
    "status": "pending"
  },
  {
    "id": "s_devfest_hyd",
    "type": "event",
    "title": "GDG DevFest Hyderabad 2026",
    "sum": "Google Developer Group Hyderabad annual developer gathering. Cloud, Android, and Gemini developer sessions.",
    "date": "2026-11-28",
    "where": "Hyderabad (HICC Novotel)",
    "badge": "HYDERABAD - OFFLINE",
    "src": "GDG Hyderabad",
    "link": "https://gdg.community.dev/gdg-hyderabad/",
    "posted": "2026-11-08",
    "status": "pending"
  },
  {
    "id": "s_fcc_agents",
    "type": "course",
    "title": "Autonomous Agents Architecture Deep Dive – FreeCodeCamp",
    "sum": "Free 8-hour hands-on curriculum covering tool calling, vector memory, multi-agent debates, and vLLM serving.",
    "date": "",
    "where": "Online",
    "badge": "ONLINE",
    "src": "FreeCodeCamp",
    "link": "https://freecodecamp.org/news/autonomous-agents",
    "posted": "2026-11-08",
    "status": "pending"
  }
];

var KEY="legion_feed";
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var mine=load(KEY+"_mine",[]);
var saved=load(KEY+"_saved",[]);
var tab="all";
var currentCity="all";
var query="";

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function days(d){if(!d)return null;var t=new Date(d+"T00:00:00"),n=new Date(TODAY+"T00:00:00");return Math.round((t-n)/864e5)}
function fmt(d){if(!d)return"";var p=d.split("-");if(p.length!==3)return d;var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return parseInt(p[2],10)+" "+m[parseInt(p[1],10)-1]+" "+p[0]}
function all(){return mine.concat(SEED)}

function isHyd(p){
  var b=p.badge?String(p.badge).toLowerCase():"";
  if(b.indexOf("hyderabad")>=0) return true;
  var w=(p.where||"").toLowerCase();
  return w.indexOf("hyderabad")>=0||w.indexOf("hitec")>=0||w.indexOf("gachibowli")>=0||w.indexOf("t-hub")>=0||w.indexOf("iiit")>=0||w.indexOf("kondapur")>=0;
}

function matchesCity(p, city){
  if(city==="all") return true;
  var w=(p.where||"").toLowerCase();
  var b=(p.badge||"").toLowerCase();
  var t=(p.title||"").toLowerCase();
  var combined = w + " " + b + " " + t;
  if(city==="hyderabad") return isHyd(p) || combined.indexOf("hyderabad")>=0;
  if(city==="bengaluru") return combined.indexOf("bengaluru")>=0 || combined.indexOf("bangalore")>=0;
  if(city==="mumbai") return combined.indexOf("mumbai")>=0;
  if(city==="delhi") return combined.indexOf("delhi")>=0 || combined.indexOf("ncr")>=0 || combined.indexOf("noida")>=0 || combined.indexOf("gurugram")>=0;
  return true;
}

function render(){
  var list=all().filter(function(p){
    if(tab==="saved") return saved.indexOf(p.id)>=0;
    if(tab!=="all" && p.type!==tab) return false;
    if(!matchesCity(p, currentCity)) return false;
    if(query){
      var hay=(p.title+" "+(p.sum||"")+" "+(p.where||"")+" "+(p.src||"")+" "+(p.type||"")).toLowerCase();
      if(hay.indexOf(query)<0) return false;
    }
    return true;
  });

  var countEl = document.getElementById("count");
  var cityLabel = currentCity === "all" ? "All India" : currentCity.charAt(0).toUpperCase() + currentCity.slice(1);
  countEl.innerHTML = "<span>" + list.length + " opportunity" + (list.length===1?"":"ies") + " in <strong>" + cityLabel + "</strong></span>" +
    (list.length > 0 ? "<span style='font-size:11.5px;color:var(--mute)'>Live high-density radar</span>" : "");

  var h="";
  list.forEach(function(p){
    var d=days(p.date),soon=d!==null&&d<=3&&d>=0;
    var isLiveNow = d !== null && d === 0 && (p.type === "hackathon" || p.type === "event");
    var tLabel=TYPE_LABELS[p.type]||p.type;
    var statusBadge=p.status?'<span class="badge-status">'+esc(p.status)+'</span>':"";
    
    var locBadge = isHyd(p)
      ? '<span class="badge badge-hyd">📍 HYDERABAD - OFFLINE</span>'
      : '<span class="badge badge-online">🌐 ONLINE</span>';
      
    var timeBadge = "";
    if(isLiveNow){
      timeBadge = '<span class="badge-live"><span class="pulse-dot"></span>LIVE NOW</span>';
    } else if(d !== null && d === 0){
      timeBadge = '<span class="badge-today">⚡ TODAY</span>';
    } else if(soon){
      timeBadge = '<span class="badge-today">⏳ ' + (d === 1 ? '1 DAY LEFT' : d + ' DAYS LEFT') + '</span>';
    }

    // Clean summary capped strictly to max 180 chars for high density
    var summaryText = (p.sum || "").trim();
    if (summaryText.length > 180) {
      summaryText = summaryText.slice(0, 177) + "…";
    }

    h+='<article class="card"><div class="top"><div class="top-left"><span class="badge t-'+p.type+'">'+tLabel+'</span> '+locBadge+' '+timeBadge+' '+statusBadge+'</div><span class="src">'+esc(p.src)+' · posted '+fmt(p.posted)+'</span></div>'+
    '<h2>'+esc(p.title)+'</h2><p>'+esc(summaryText)+'</p><div class="meta">'+
    (p.date?'<span class="'+(soon?"soon":"")+'">📅 '+fmt(p.date)+(d!==null&&soon?" · "+(d===0?"today":d+"d left"):"")+'</span>':"")+
    (p.where?'<span>📍 '+esc(p.where)+'</span>':"")+'</div><div class="acts">'+
    (p.link?'<a class="btn pri" target="_blank" rel="noopener" href="'+esc(p.link)+'">Open link ↗</a>':"")+
    '<button class="btn btn-wa" data-a="copy" data-id="'+p.id+'">📋 Copy for WhatsApp</button>'+
    (p.date?'<button class="btn" data-a="cal" data-id="'+p.id+'" title="Download .ics calendar event">📅 Cal</button>':"")+
    '<button class="btn" data-a="save" data-id="'+p.id+'">'+(saved.indexOf(p.id)>=0?"★ Saved":"☆ Save")+'</button>'+
    (p.id.charAt(0)==="m"?'<button class="btn" data-a="del" data-id="'+p.id+'">Delete</button>':"")+'</div></article>';
  });

  document.getElementById("feed").innerHTML=h||'<div class="empty">No opportunities match this filter. Try switching metro hubs or category.</div>';
}

function tabs(){
  document.getElementById("tabs").innerHTML=Object.keys(TYPES).map(function(k){
    return'<button class="tab" data-t="'+k+'" aria-pressed="'+(k===tab)+'">'+TYPES[k]+'</button>';
  }).join("");
}

function toast(m,dur){
  var t=document.getElementById("toast");
  t.textContent=m;
  t.className="toast on";
  setTimeout(function(){t.className="toast"},dur||(m.length>25?3000:1800));
}

// Strict Minimal WhatsApp Message Generator (< 200 characters)
function wa(p){
  var em={job:"💼",hackathon:"⚡",event:"🗓️",course:"🎓",news:"💡"}[p.type]||"🚀";
  var badge = isHyd(p) ? "[HYDERABAD - OFFLINE]" : "[ONLINE]";
  var badgeSuffix = (p.title && p.title.indexOf(badge) < 0) ? " " + badge : "";
  
  // Clean, concise 1-sentence summary max 130 chars
  var sumText = (p.sum || "").replace(/\s+/g, " ").trim();
  sumText = sumText.replace(/\*\*.*?\*\*/g, "").replace(/#[A-Za-z0-9_-]+/g, "").trim();
  if (sumText.length > 130) {
    var cut = sumText.slice(0, 130);
    var lastDot = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("; "));
    sumText = (lastDot > 40 ? cut.slice(0, lastDot + 1) : cut.trim()) + "…";
  }

  var lines = [
    em + " *" + p.title + "*" + badgeSuffix,
    "",
    "📌 " + (sumText || ("Update via " + (p.src || "Legion Feed")))
  ];

  if (p.date) {
    lines.push("📅 Date: " + fmt(p.date));
  }
  var whereVal = p.where || (isHyd(p) ? "Hyderabad" : "Online");
  lines.push("📍 Venue: " + whereVal);
  if (p.link) {
    lines.push("🔗 Apply: " + p.link);
  }

  return lines.join("\n");
}

// Inline iCalendar (.ics) generator
function downloadIcs(p){
  if(!p || !p.date) return;
  var rawDate = p.date.replace(/-/g, "");
  var icsData = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Legion India Tech Feed//EN",
    "BEGIN:VEVENT",
    "SUMMARY:" + (p.title || "Tech Event").replace(/,/g, "\\,"),
    "DESCRIPTION:" + (p.sum || "").replace(/\n/g, " ").slice(0, 180),
    "LOCATION:" + (p.where || "Online"),
    "DTSTART:" + rawDate + "T090000Z",
    "DTEND:" + rawDate + "T180000Z",
    "URL:" + (p.link || ""),
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");

  var blob = new Blob([icsData], { type: "text/calendar;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = (p.title || "event").slice(0, 25).replace(/[^a-zA-Z0-9]/g, "_") + ".ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("📅 Calendar event downloaded");
}

document.addEventListener("click",function(e){
  // Metro City Switcher
  var cBtn=e.target.closest("[data-city]");
  if(cBtn){
    currentCity=cBtn.dataset.city;
    document.querySelectorAll(".city-pill").forEach(function(b){b.setAttribute("aria-pressed", b.dataset.city===currentCity?"true":"false")});
    render();
    return;
  }

  // Category Tab
  var t=e.target.closest("[data-t]");
  if(t){
    tab=t.dataset.t;
    tabs();
    render();
    return;
  }

  // Card Actions
  var b=e.target.closest("[data-a]");
  if(!b) return;
  var id=b.dataset.id,p=all().filter(function(x){return x.id===id})[0];
  if(!p) return;

  if(b.dataset.a==="copy"){
    var txt=wa(p);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        toast("📋 Copied WhatsApp draft (" + txt.length + " chars)");
      },function(){
        prompt("Copy WhatsApp draft:", txt);
      });
    } else {
      prompt("Copy WhatsApp draft:", txt);
    }
  }

  if(b.dataset.a==="cal"){
    downloadIcs(p);
  }

  if(b.dataset.a==="save"){
    var i=saved.indexOf(id);
    if(i>=0) saved.splice(i,1);
    else saved.push(id);
    store(KEY+"_saved",saved);
    render();
    toast(saved.indexOf(id)>=0?"★ Saved to bookmarks":"Removed from saved");
  }

  if(b.dataset.a==="del"){
    mine=mine.filter(function(x){return x.id!==id});
    store(KEY+"_mine",mine);
    render();
    toast("Deleted post");
  }
});

document.getElementById("q").addEventListener("input",function(e){
  query=e.target.value.toLowerCase();
  render();
});

var dlg=document.getElementById("dlg");
document.getElementById("add").onclick=function(){dlg.showModal()};
document.getElementById("cancel").onclick=function(){dlg.close()};
document.getElementById("save").onclick=function(){
  var g=function(i){return document.getElementById(i).value.trim()};
  if(!g("f-title")){toast("Title is required");return}
  mine.unshift({
    id:"m"+Date.now(),
    type:g("f-type"),
    title:g("f-title"),
    sum:g("f-sum"),
    date:g("f-date"),
    where:g("f-where"),
    src:g("f-src")||"Admin",
    link:g("f-link"),
    posted:TODAY
  });
  store(KEY+"_mine",mine);
  ["f-title","f-sum","f-date","f-where","f-src","f-link"].forEach(function(i){document.getElementById(i).value=""});
  dlg.close();
  render();
  toast("Post added successfully");
};

document.getElementById("theme").onclick=function(){
  var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
};

document.getElementById("upd").textContent="Updated "+fmt(TODAY);

function loadFeed(){
  return fetch("posts.json?t=" + Date.now(), {cache: "no-store"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
    .then(function(data){
      if(Array.isArray(data)&&data.length>0){
        SEED=data;
      }
      tabs();render();
      document.getElementById("upd").textContent="Updated "+fmt(TODAY);
      return all().length;
    })
    .catch(function(e){
      tabs();render();
      return all().length;
    });
}
loadFeed();

var refreshBtn = document.getElementById("refresh-btn");
if(refreshBtn){
  refreshBtn.onclick = function(){
    if(refreshBtn.disabled) return;
    if(window.location.protocol === "file:"){
      toast("⚠️ Offline file mode. Run: python pipeline.py --serve 8000");
      return;
    }
    refreshBtn.disabled = true;
    var origHtml = refreshBtn.innerHTML;
    refreshBtn.innerHTML = '<span class="spin">🔄</span> Updating…';
    toast("🔄 Fetching latest opportunities…", 4000);

    fetch("/api/refresh", {method: "POST"})
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
      .then(function(res){
        return loadFeed().then(function(cnt){
          toast("✅ Refreshed! " + cnt + " opportunities live.");
        });
      })
      .catch(function(err){
        loadFeed().then(function(cnt){
          toast("✅ Feed updated (" + cnt + " opportunities).");
        }).catch(function(){
          toast("⚠️ Refresh error: " + err.message);
        });
      })
      .finally(function(){
        refreshBtn.disabled = false;
        refreshBtn.innerHTML = origHtml;
      });
  };
}

// Client auto-poll every 3 minutes
setInterval(function(){
  if(window.location.protocol !== "file:"){
    loadFeed();
  }
}, 180000);
</script>
</body>
</html>
